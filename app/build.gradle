
plugins {
    id 'com.android.application'
}

def signingProperties = new Properties()
def signingPropertiesFile = rootProject.file('local.properties')

if (signingPropertiesFile.exists()) {
    signingPropertiesFile.withInputStream {
        signingProperties.load(it)
    }
}

def releaseStoreFile = signingProperties.getProperty('RELEASE_STORE_FILE')
def releaseStorePassword = signingProperties.getProperty('RELEASE_STORE_PASSWORD')
def releaseKeyAlias = signingProperties.getProperty('RELEASE_KEY_ALIAS')
def releaseKeyPassword = signingProperties.getProperty('RELEASE_KEY_PASSWORD')

def requiredSigningProps = [
    'RELEASE_STORE_FILE'    : releaseStoreFile,
    'RELEASE_STORE_PASSWORD': releaseStorePassword,
    'RELEASE_KEY_ALIAS'     : releaseKeyAlias,
    'RELEASE_KEY_PASSWORD'  : releaseKeyPassword,
]

def missingSigningProps = requiredSigningProps
    .findAll { _, v -> v == null || v.trim().isEmpty() }
    .keySet()
    .toList()

def hasReleaseSigning = missingSigningProps.isEmpty()

android {
    namespace 'com.sabinaya.pixelmm'
    compileSdk 33

    defaultConfig {
        applicationId 'com.sabinaya.pixelmm'
        minSdk 33
        targetSdk 33
        versionCode 1
        versionName '0.1.0'
    }

    if (hasReleaseSigning) {
        signingConfigs {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}

tasks.register('verifyReleaseSigning') {
    doLast {
        if (!missingSigningProps.isEmpty()) {
            throw new GradleException(
                'Release signing is required. Missing or empty in local.properties: ' +
                missingSigningProps.join(', ')
            )
        }
        if (!file(releaseStoreFile).exists()) {
            throw new GradleException(
                'Release signing keystore file not found for RELEASE_STORE_FILE.'
            )
        }
    }
}

tasks.matching {
    it.name in ['preReleaseBuild', 'assembleRelease', 'packageRelease', 'bundleRelease']
}.configureEach {
    dependsOn('verifyReleaseSigning')
}
